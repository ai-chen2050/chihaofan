<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="icon.png">
<title>吃好饭 · 法律文档</title>
<style>
  :root { --ink: #1e4632; --sub: #4a6a58; --bg: #f6faf7; --card: #ffffff; --line: #dce8e0; --accent: #2EBD85; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #d8ede0; --sub: #9ab8a6; --bg: #131a16; --card: #1b241f; --line: #2a3830; --accent: #3fd49a; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
         background: var(--bg); color: var(--ink); min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px;
          padding: 40px 32px; text-align: center; max-width: 420px; width: 100%; }
  .logo { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 4px 14px rgba(30,70,50,.18); }
  h1 { font-size: 22px; font-weight: 800; margin: 12px 0 4px; }
  p { font-size: 13.5px; color: var(--sub); margin-bottom: 24px; }
  a.btn { display: block; margin: 10px 0; padding: 13px; border-radius: 12px;
          background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; font-size: 15px; }
  a.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icon.png" alt="吃好饭" width="72" height="72">
    <h1>吃好饭</h1>
    <p>AI 冰箱管家与食谱 · 数据只在你的手机里</p>
    <a class="btn" href="privacy.html">隐私政策</a>
    <a class="btn ghost" href="terms.html">用户协议</a>
    <a class="btn ghost" href="privacy-en.html">Privacy Policy (EN)</a>
    <a class="btn ghost" href="terms-en.html">Terms of Service (EN)</a>
  </div>
</body>
</html>
